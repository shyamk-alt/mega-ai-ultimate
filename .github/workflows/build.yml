name: Build MEGA AI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: cp lib/main.dart /tmp/m.dart
      - run: flutter create . --platforms=android --project-name mega_ai_ultimate
      - run: cp /tmp/m.dart lib/main.dart
      - run: sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MEGA-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
